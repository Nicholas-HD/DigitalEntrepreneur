services:
  db:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=church_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=rahasia_gereja
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    
    command: tail -f /dev/null 
    depends_on:
      - db


volumes:
  postgres_data: